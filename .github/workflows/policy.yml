name: policy

on:
  push:
  pull_request:

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install
        run: pip install -e ".[test,security]"
      - name: Compile check
        run: python -m compileall -q src tests
      - name: Unit tests
        run: python -m pytest -q
      - name: Python security scan
        run: bandit -r src -lll
      - name: Isolation audit
        run: python -m exonym --root . verify
      - name: JSON schema validation
        run: python -m exonym --root . verify --schemas-only
      # Semgrep 1.136.0 publishes wheels through Python 3.11 and its
      # OpenTelemetry dependency imports pkg_resources from setuptools.
      - name: Set up Semgrep runtime
        id: semgrep-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static analysis
        run: >-
          pipx run --python "${{ steps.semgrep-python.outputs.python-path }}"
          --pip-args="setuptools<81" "semgrep==1.136.0" scan
          --config p/python --severity ERROR --error --metrics=off src

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_ENABLE_COMMENTS: "false"
