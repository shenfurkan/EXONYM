[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exonym"
version = "2.0.1"
description = "EXONYM: candidate-isolated framework for reproducible TESS exoplanet research"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.13.1",
  "pandas==2.3.3",
  "matplotlib==3.9.4",
  "astropy==6.0.1",
  "astroquery==0.4.11",
  "lightkurve==2.6.0",
  "batman-package==2.5.3",
  "celerite==0.4.3",
  "emcee==3.1.6",
  "corner==2.3.0",
  "ldtk==1.8.6",
  "jsonschema==4.25.1",
  "packaging==26.2",
  "requests==2.32.5",
  "rich==15.0.0"
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-mock==3.15.1", "Pillow==11.3.0", "pre-commit==3.8.0"]
security = ["bandit==1.8.6"]
debug = ["coverage==7.6.10", "pytest-cov==6.0.0", "ruff==0.8.6"]
screening = ["triceratops==1.0.20"]
discovery = ["transitleastsquares==1.32"]
inference = ["dynesty==3.0.0"]
detrending = ["wotan==1.10"]
asteroseismology = ["pysyd==6.10.5", "tess-atl==0.0.3.1"]

[project.scripts]
exonym = "exonym.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"exonym._resources" = [
  "schemas/*.json",
  "schemas/*/*.json",
  "templates/*.md",
  "templates/*/*.md",
  "templates/*/*/*.md",
  "templates/*/*.tex"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = [
    "ignore:.*the tpfmodel submodule is not available.*:UserWarning",
]
