# Repository checks run before commits and in GitHub Actions.
# The project supports Python 3.9, so CI pins pre-commit 3.8.0 in pyproject.toml.
minimum_pre_commit_version: "3.8.0"
default_install_hook_types: [pre-commit]
exclude: ^candidate/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: exonym-verify
        name: EXONYM repository isolation and schema audit
        entry: python -m exonym --root . verify
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
